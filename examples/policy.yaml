# chokepoint example policy
#
# Rules are evaluated top to bottom and the first non-audit match wins, so the
# specific goes above the general. Anything not matched falls through to
# default_effect.
#
# Available variables:
#   tool                  string   tool name, e.g. "read_file"
#   method                string   JSON-RPC method, e.g. "tools/call"
#   args                  map      decoded tool arguments
#   targets               list     target-like strings pulled out of args
#   session_calls         int      calls made in this session
#   session_targets       int      distinct targets touched this session
#   calls_in_window       int      calls inside `rate_window` below
#   targets_in_window     int      distinct targets inside `rate_window`
#   decomposition_score   double   UBFS decomposition score, 0.0-1.0
#   tool_definition_changed  bool  this tool changed since the first tools/list
#   schema_known          bool     this tool declared an inputSchema that compiled
#   args_valid            bool     args satisfied it (true when schema_known is false)
#   schema_violations     list     what failed, bounded and sorted
#   session_tools_changed    int   distinct tools changed since the first listing
#   scope_declared        bool     whether `workspace` below is non-empty
#   out_of_scope          list     this call's targets outside the workspace
#   session_out_of_scope  int      distinct out-of-scope resources this session

default_effect: allow

# How far back calls_in_window and targets_in_window look. There is no limit
# setting to go with it — the limit is a rule, so it sits with the others and
# can be combined with the tool, the scope and the score.
rate_window: 1m

# Where this agent is supposed to reach: absolute paths or URI prefixes.
#
# Leave it empty and every scope rule below stays inert — `scope_declared` goes
# false and nothing is ever out of scope. That is the default because a
# workspace only exists on a deployment whose operator can say where the agent
# belongs, and a proxy that denies every call until told otherwise cannot be
# introduced into a working system.
#
# Comparison is on the normalised resource, so "/srv/data/../../etc/shadow" is
# out of scope and "/srv/data/sub/../f01" is not. Boundaries are segment
# aligned: "/srv/data" does not contain "/srv/database".
workspace:
  - /srv

rules:
  # Deploy a rule as `audit` first. Watch the logs, confirm it fires when you
  # expect and only then, and change the effect to `deny`. Arming a rule that
  # has never been measured is how a proxy becomes the thing that broke prod.
  - name: watch-writes
    match: tool.startsWith("write") || tool.startsWith("delete")
    effect: audit

  # The rug pull: a server advertises benign tools, gets approved, then mutates
  # a definition afterwards. The agent re-reads the list, finds new instructions
  # in a description or a widened schema, and acts on them. The call that
  # follows looks entirely normal — it matches what the server now advertises —
  # which is why no amount of behavioural scoring sees it.
  #
  # Definitions are fingerprinted against the session's FIRST listing, so a
  # server cannot launder a mutation by changing a definition and changing it
  # back. Key order is not a change; array order is.
  - name: tool-definition-changed
    match: tool_definition_changed
    effect: deny
    message: >-
      This tool's definition has changed since this session started. That is
      the signature of a tool-poisoning attack. Stop and have an operator
      re-approve the server before using it again.

  # Holds the server to the contract it published. MCP servers are lax about
  # enforcing their own inputSchema, so an argument a tool never declared can
  # still reach it — and validation is against the schema from the FIRST
  # listing, so a server that widens one mid-session to admit an exfiltration
  # argument does not get to ratify it. That is the half of the rug pull the
  # fingerprint above flags but cannot act on call by call.
  #
  # `schema_known` is the guard and is not optional. Most tools in the wild
  # ship no schema at all; without it this rule denies every one of them.
  # args_valid is true when there is nothing to check, so the mistake fails
  # open rather than closed, but write the guard anyway — it says what you mean.
  #
  # Shipped as audit for the same reason as the rate rule below: a schema
  # strict enough to be worth enforcing is also strict enough to break a
  # working agent, and that is a question about your servers, not about this
  # file. Watch chokepoint.schema.violations for a week, then arm it.
  - name: args-violate-declared-schema
    match: schema_known && !args_valid
    effect: audit

  # Individually legitimate calls, blocked for what they add up to. This is
  # the rule the project exists for: the failure mode the threat-to-governance
  # research identified as architectural rather than a tuning problem.
  - name: halt-decomposed-sweep
    match: decomposition_score > 0.45 && session_targets > 25
    effect: deny
    message: >-
      This session has touched an unusually broad set of targets with low
      repetition, which matches a decomposed-task pattern. Narrow the task or
      request an operator review.

  # Ordinary path containment. Kept above the workspace rule below so that a
  # refusal names the specific thing being refused, and because it still
  # applies on a deployment that declares no workspace at all. `targets` is
  # already extracted from whatever argument names the server happens to use.
  - name: no-credential-paths
    match: targets.exists(t, t.contains("/.ssh/") || t.endsWith(".pem") || t.contains("/.aws/"))
    effect: deny
    message: Credential material is out of scope; use the configured secret store.

  - name: no-cloud-metadata
    match: targets.exists(t, t.contains("169.254.169.254") || t.contains("metadata.google"))
    effect: deny
    message: Cloud instance metadata is not reachable through this gateway.

  # Recursive deletion is the one operation with no safe retry.
  - name: no-recursive-delete
    match: tool == "delete" && has(args.recursive) && args.recursive == true
    effect: deny
    message: Recursive delete is disabled. Delete specific paths instead.

  # Rate, shipped as `audit` rather than `deny` on purpose.
  #
  # Every other threshold in this file comes from a measured separation band.
  # This one cannot: there is no such thing as a generally correct tool-call
  # rate, because it depends entirely on what the agent is for. A build agent
  # reading a thousand files in a minute is working; a support agent doing the
  # same is not. So the number below is a starting point, not a finding.
  #
  # Run it as audit, read `chokepoint.rate.*` out of the evidence log for a
  # week, then set the number from what you saw and switch the effect. Arming a
  # rate limit that has never been measured against the deployment is how a
  # proxy becomes the thing that broke production.
  #
  # targets_in_window rather than calls_in_window: an agent retrying one file
  # is fast and narrow, a sweep is fast and wide, and only the second is
  # evidence of anything.
  - name: high-fan-out-rate
    match: targets_in_window > 100
    effect: audit

  # The backstop, and the answer to the sweep the score cannot see. A session
  # calling one tool against any number of targets scores a constant 0.400
  # however many files it reads, so no threshold on `decomposition_score`
  # catches it. This rule does not ask how varied the behaviour looks, only
  # whether the call landed where the agent was sent — so it fires on the
  # first out-of-bounds call at any scale, and an attacker who declines to
  # vary their tool vocabulary gains nothing.
  #
  # It goes last because everything above it refuses something specific and
  # can say so; this one is the general boundary.
  #
  # Guarded on `scope_declared` so that emptying `workspace` above disarms the
  # rule rather than turning it into a deny-all.
  - name: outside-declared-workspace
    match: scope_declared && out_of_scope.size() > 0
    effect: deny
    message: >-
      That path is outside this agent's declared workspace. Work within the
      configured directories, or ask an operator to widen the workspace.
