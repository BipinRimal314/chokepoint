name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a break caused by a new Go release or a dependency update is
  # found on a schedule rather than the next time someone happens to push.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # go.mod declares 1.25.0 as the minimum, so 1.25 is tested to prove
        # that claim rather than assuming it. `stable` catches breakage from
        # new releases before a user hits it. Keep this pinned entry in step
        # with go.mod: naming a version below the directive does not test it,
        # GOTOOLCHAIN just downloads the newer toolchain and the leg passes
        # while proving nothing.
        go: ["1.25", "stable"]
        os: [ubuntu-latest, macos-latest]
        include:
          # Windows differs in path handling and process teardown, both of
          # which this proxy touches; one job is enough to catch that.
          - go: stable
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Download dependencies
        run: go mod download

      - name: Verify go.mod and go.sum are tidy
        # A stale go.mod means a fresh clone builds something different from
        # what CI tested.
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        # -count=2 because the concurrency bugs that matter here are timing
        # dependent; a single pass can miss a teardown race entirely.
        run: go test -race -count=2 ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

  release-config:
    name: release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # The release workflow only runs on tags, so without this a broken
      # .goreleaser.yaml is discovered at the worst possible moment: after the
      # tag is pushed, with a half-published release to clean up. A snapshot
      # build is the same work minus the upload.
      - name: Validate and dry-run the release build
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=announce

      - name: Every documented platform produced an archive the installer can name
        # deploy/k3s/10-installer-daemonset.yaml rebuilds an asset name as
        # chokepoint_<version>_<os>_<arch>.tar.gz from CHOKEPOINT_VERSION and
        # `uname -m`, so both separators around the version are load-bearing.
        #
        # Matching only the suffix was not enough to protect that: rename the
        # template to chokepoint-<version>_linux_amd64.tar.gz and the archive
        # still ends in _linux_amd64.tar.gz, so this step passed while every
        # node would 404 on the next release. Pin the prefix goreleaser is
        # asked to produce as well, and leave only the version free -- it has
        # to be, since a snapshot build here versions itself differently from
        # a tagged one.
        run: |
          fail() {
            echo "FAIL: $1"
            echo "the installer reconstructs chokepoint_<version>_<os>_<arch>; dist has:"
            ls -1 dist/*.tar.gz dist/*.zip 2>/dev/null || echo "  (no archives at all)"
            exit 1
          }
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            ls dist/chokepoint_*_"$target".tar.gz >/dev/null 2>&1 \
              || fail "no archive named chokepoint_<version>_$target.tar.gz"
          done
          ls dist/chokepoint_*_windows_amd64.zip >/dev/null 2>&1 \
            || fail "no archive named chokepoint_<version>_windows_amd64.zip"
          echo "all documented platforms present, named as the installer expects"

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: go build -o chokepoint ./cmd/chokepoint

      - name: Proxy a real MCP server subprocess
        # The bug that dropped 40 of 41 in-flight replies passed every unit
        # test and was only caught by running the real binary against a real
        # child process. That is why this job exists.
        run: |
          python3 - <<'PY' > requests.jsonl
          import json
          out = [{"jsonrpc":"2.0","id":0,"method":"initialize",
                  "params":{"protocolVersion":"2025-06-18"}}]
          tools = ["read_file","list_dir","grep","stat"]
          for i in range(40):
              out.append({"jsonrpc":"2.0","id":i+1,"method":"tools/call",
                          "params":{"name":tools[i%4],
                                    "arguments":{"path":f"/srv/data/f{i:03d}"}}})
          for o in out:
              print(json.dumps(o))
          PY

          ./chokepoint --policy examples/policy.yaml \
            -- python3 testdata/mock_mcp_server.py \
            < requests.jsonl > responses.jsonl 2> proxy.log

          python3 - <<'PY'
          import json, sys
          allowed = denied = 0
          for line in open("responses.jsonl"):
              line = line.strip()
              if not line:
                  continue
              msg = json.loads(line)
              if "error" in msg:
                  denied += 1
              else:
                  allowed += 1
          total = allowed + denied
          print(f"responses={total} allowed={allowed} denied={denied}")

          # Every request must be answered exactly once, whether by the
          # upstream or by a policy denial. A short count means replies were
          # dropped on teardown.
          if total != 41:
              sys.exit(f"FAIL: expected 41 responses, got {total}")
          # This sweep stays inside the declared workspace, and since
          # docs/single-tool-sweep.md the score alone no longer denies -- a
          # wide in-scope session is what thorough work looks like too. It
          # must still be recorded.
          if denied != 0:
              sys.exit(f"FAIL: an in-workspace sweep was blocked ({denied} denials)")
          if "watch-decomposed-sweep" not in open("proxy.log").read():
              sys.exit("FAIL: the sweep was not even audited, so the policy is decorative")
          PY

      - name: Deny a sweep that leaves the workspace
        # The other half of the same rule. Corroboration means the deny fires
        # once the session has reached outside what it was given, so a sweep
        # that never was inside must be stopped by name.
        run: |
          python3 - <<'PY' > out-of-scope.jsonl
          import json
          out = [{"jsonrpc":"2.0","id":0,"method":"initialize",
                  "params":{"protocolVersion":"2025-06-18"}}]
          tools = ["read_file","list_dir","grep","stat"]
          for i in range(40):
              out.append({"jsonrpc":"2.0","id":i+1,"method":"tools/call",
                          "params":{"name":tools[i%4],
                                    "arguments":{"path":f"/var/lib/other/f{i:03d}"}}})
          for o in out:
              print(json.dumps(o))
          PY

          ./chokepoint --policy examples/policy.yaml \
            -- python3 testdata/mock_mcp_server.py \
            < out-of-scope.jsonl > out-of-scope-responses.jsonl 2> out-of-scope.log

          python3 - <<'PY'
          import sys
          log = open("out-of-scope.log").read()
          if "halt-decomposed-sweep" not in log:
              sys.exit("FAIL: a sweep outside the workspace was never denied by the sweep rule")
          print("out-of-scope sweep denied by halt-decomposed-sweep")
          PY

      - name: Scrape metrics from a live session
        # Metrics are only meaningful if they reflect a real proxied session,
        # so this drives the binary and scrapes it mid-run rather than
        # asserting against a hand-built Telemetry.
        run: |
          cat > feed.py <<'PY'
          import json, sys, time

          tools = ["read_file", "list_dir", "grep", "stat"]
          out = sys.stdout
          out.write(json.dumps({"jsonrpc": "2.0", "id": 0, "method": "initialize",
                                "params": {"protocolVersion": "2025-06-18"}}) + "\n")
          out.flush()
          for i in range(40):
              out.write(json.dumps({"jsonrpc": "2.0", "id": i + 1, "method": "tools/call",
                                    "params": {"name": tools[i % 4],
                                               "arguments": {"path": f"/srv/data/f{i:03d}"}}}) + "\n")
              out.flush()
              time.sleep(0.02)
          # Hold stdin open so the endpoint can be scraped mid-session.
          time.sleep(20)
          PY

          python3 feed.py \
            | ./chokepoint --policy examples/policy.yaml --metrics-addr 127.0.0.1:9464 \
              -- python3 testdata/mock_mcp_server.py > metrics-run.jsonl 2> metrics-run.log &
          PROXY_PID=$!

          # Wait for the endpoint rather than sleeping a guessed interval.
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:9464/healthz >/dev/null; then break; fi
            sleep 0.5
          done

          # Then poll until all 40 calls have been accounted for. Scraping as
          # soon as the endpoint answers races the feeder and yields a partial
          # count — locally it read 39 of 40, which would have been an
          # intermittent CI failure rather than an obvious one.
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:9464/metrics > metrics.txt || true
            seen=$(grep -c '^chokepoint_tool_calls_total{' metrics.txt || echo 0)
            total=$(awk '/^chokepoint_tool_calls_total\{/ {s+=$2} END {print s+0}' metrics.txt)
            if [ "$total" = "40" ]; then break; fi
            sleep 0.5
          done
          echo "observed $total tool calls across $seen series"
          wait $PROXY_PID || true

          python3 - <<'PY'
          import re, sys
          text = open("metrics.txt").read()

          def total(name):
              return sum(float(m) for m in
                         re.findall(rf'^{name}\{{[^}}]*\}} ([0-9.e+-]+)$', text, re.M))

          allowed = sum(float(v) for v in
                        re.findall(r'^chokepoint_tool_calls_total\{effect="allow"[^}]*\} ([0-9.e+-]+)$',
                                   text, re.M))
          denied = sum(float(v) for v in
                       re.findall(r'^chokepoint_tool_calls_total\{effect="deny"[^}]*\} ([0-9.e+-]+)$',
                                  text, re.M))
          print(f"allowed={allowed} denied={denied} "
                f"denials={total('chokepoint_policy_denials_total')} "
                f"audits={total('chokepoint_policy_audits_total')}")

          if allowed + denied != 40:
              sys.exit(f"FAIL: counted {allowed + denied} tool calls, expected 40")
          # This sweep is inside the declared workspace, so since
          # docs/single-tool-sweep.md it is audited rather than denied. The
          # audit counter is what proves the rule fired.
          audits = total("chokepoint_policy_audits_total")
          if denied != 0:
              sys.exit(f"FAIL: an in-workspace sweep was denied ({denied} calls)")
          if audits == 0:
              sys.exit("FAIL: the sweep was never audited, so the rule never fired")
          if "chokepoint_decomposition_score" not in text:
              sys.exit("FAIL: decomposition score not exported")
          if "chokepoint_abandoned_spans_total 0" not in text:
              sys.exit("FAIL: spans were abandoned during a clean run")
          print("metrics assertions hold")
          PY

      - name: Show proxy log on failure
        if: failure()
        run: cat proxy.log metrics-run.log 2>/dev/null || true
